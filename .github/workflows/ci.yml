name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system Qt + GL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pyqt6 libgl1 libegl1 libglib2.0-0 xvfb \
            ghostscript qpdf poppler-utils tesseract-ocr \
            7zip p7zip-full unrar

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,pdf]"
          # Provide the external helpers the tools shell out to.
          python -m pip install ocrmypdf img2pdf zstandard pytest-xdist

      - name: Run tests
        run: xvfb-run -a pytest -q -n auto
