name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system runtime libraries + helper tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-venv python3-dev libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            ghostscript qpdf poppler-utils tesseract-ocr \
            7zip p7zip-full unrar zstd
          python3 -m pip install --upgrade pip
          python3 -m pip install ocrmypdf img2pdf uv

      - name: Build portable bundle
        run: bash -x tools/bundle.sh "${{ github.workspace }}/dist/cachyview"

      - name: Package bundle as tar.zst
        run: |
          cd "${{ github.workspace }}/dist"
          tar --zstd -cf "cachyview-${GITHUB_REF_NAME#v}-linux.tar.zst" cachyview
          sha256sum "cachyview-${GITHUB_REF_NAME#v}-linux.tar.zst" \
            > "cachyview-${GITHUB_REF_NAME#v}-linux.tar.zst.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="${{ github.workspace }}/dist/cachyview-${VERSION}-linux.tar.zst"
          SUM="${{ github.workspace }}/dist/cachyview-${VERSION}-linux.tar.zst.sha256"
          # A curated release may already exist (created before the tag was
          # pushed); in that case just attach the portable bundle to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "$SUM" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "CachyView $VERSION" \
              --generate-notes \
              "$ASSET" "$SUM"
          fi
