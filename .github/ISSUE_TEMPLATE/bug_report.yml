name: Bug report
description: Report a problem with CachyView
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? Include the file type if relevant.
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: e.g. CachyOS, Arch, Fedora 40, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CachyView version
      description: From `cachyview --version` or the About box.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste any terminal output or error text.
    validations:
      required: false
