[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachyview"
version = "0.2.0"
description = "Fast native archive, PDF, image and text toolkit for Linux"
requires-python = ">=3.11"
dependencies = ["PyQt6", "Pillow"]

[project.optional-dependencies]
pdf = ["PyMuPDF", "pikepdf", "img2pdf", "numpy"]
dev = ["pytest"]

[project.scripts]
cachyview = "cachyview.__main__:main"
cachyview-cli = "cachyview.integration.cli:main"

[tool.setuptools.package-data]
cachyview = ["data/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
